<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M0NARQ | The Nervous System of Digital Bangladesh</title>
  
  <link rel="stylesheet" href="assets/css/styles.css?v=4.1.2.css">

  <style>
    :root {
      --hex-red-1: #00D4FF; /* Electric Cyan */
      --hex-bg-1: #050505;  /* Deep Black */
      --font-code: 'Courier New', monospace;
    }
    
    /* Ensure sticky sections work with the original layout engine */
    body[data-template="monarq"] .home-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Terminal Window */
    .monarq-terminal {
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #333;
      border-left: 3px solid var(--hex-red-1);
      padding: 1.5rem;
      font-family: var(--font-code);
      color: #00D4FF;
      min-height: 300px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      white-space: pre-wrap;
      font-size: 0.85rem;
      position: relative;
    }
    
    /* Document Card */
    .doc-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      transform: perspective(1000px) rotateY(-5deg);
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      opacity: 0.4;
      filter: grayscale(100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .doc-card.active {
      transform: perspective(1000px) rotateY(0deg) scale(1.05);
      opacity: 1;
      filter: grayscale(0%);
      box-shadow: 0 0 0 2px var(--hex-red-1), 0 40px 80px rgba(0, 212, 255, 0.15);
    }

    /* Badge */
    .status-badge {
      position: absolute; top: 10px; right: 10px;
      padding: 4px 8px; background: #000; color: #fff;
      font-size: 10px; font-weight: bold; letter-spacing: 1px;
    }
  </style>
</head>

<body data-template="monarq">
  
  <header id="site-header">
    <div class="layout-container" id="site-header-content">
      <h1 class="heading-logo">
        <a href="/"><span style="font-weight:900; font-size:1.5rem;">M0NARQ</span></a>
      </h1>
      <nav id="site-menu">
        <ul>
          <li><a class="main-nav-link" href="#intro">Vision</a></li>
          <li><a class="main-nav-link" href="#demo">Live Demo</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <main id="home" class="layout-container">
    
    <section id="intro" class="home-section text-layout">
      <div class="home-section-content">
        <div class="home-section-text">
          <h2 class="text-xxxxl">Digital Nervous System<br>for <span style="color:var(--hex-red-1)">Bangladesh</span></h2>
          <p>Processing <span id="counter">0</span> documents annually.</p>
        </div>
      </div>
    </section>

    <section id="demo" class="home-section-container" style="position: relative;">
      
      <div class="home-section fixed-section" style="pointer-events: none;">
        <div class="home-section-content" style="display: flex; align-items: center; justify-content: flex-end;">
          <div style="width: 45%; position: relative;">
            
            <div id="vis-cheque" class="doc-card" style="position: absolute; width: 100%;">
              <div class="status-badge">BANKCORE</div>
              <img src="https://placehold.co/600x300/111/FFF?text=Cheque+Scanning..." style="width:100%">
              <div class="monarq-terminal" id="term-cheque" style="display:none; margin-top:1rem;"></div>
            </div>

            <div id="vis-form" class="doc-card" style="position: absolute; width: 100%; opacity: 0;">
              <div class="status-badge">GOVCORE</div>
              <img src="https://placehold.co/500x700/111/FFF?text=Form+Extraction..." style="width:100%">
              <div class="monarq-terminal" id="term-form" style="display:none; margin-top:1rem;"></div>
            </div>

          </div>
        </div>
      </div>

      <div style="position: relative; z-index: 2;">
        
        <section id="step-cheque" class="home-section feature-section text-layout" data-trigger="cheque">
          <div class="home-section-content">
            <div class="home-section-text">
              <h2>BankCore Alpha</h2>
              <p>PaddleOCR + Gemini Flash processing 97% accurate Bengali handwriting.</p>
            </div>
          </div>
        </section>

        <section id="step-form" class="home-section feature-section text-layout" data-trigger="form">
          <div class="home-section-content">
            <div class="home-section-text">
              <h2>GovCore Extraction</h2>
              <p>Complex layout parsing for Deeds, NIDs, and Application Forms.</p>
            </div>
          </div>
        </section>

      </div>
    </section>

  </main>

  <script src="assets/js/scripts.js?v=4.1.2"></script>
  
  <script src="assets/js/monarq-logic.js"></script>

</body>
</html>
